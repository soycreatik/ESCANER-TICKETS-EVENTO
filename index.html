<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELEGIDOS - Validador de Tickets</title>
    
    <link rel="icon" type="image/png" href="LOGOS/ELEGIDOS VER.2.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000; 
            --card-bg: rgba(15, 15, 15, 0.65); 
            --card-border: rgba(227, 218, 201, 0.15); 
            --card-border-hover: rgba(227, 218, 201, 0.4);
            --text-main: #E3DAC9; 
            --text-muted: #9c978e;
            --accent-color: #D5C7A3; 
            --accent-glow: rgba(227, 218, 201, 0.2);
            --status-valid: rgba(35, 134, 54, 0.85);
            --status-used: rgba(217, 119, 6, 0.85);
            --status-invalid: rgba(218, 54, 51, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- FONDO VIDRIO Y RUCO --- */
        .site-bg-image {
            position: fixed;
            top: -5%; left: -5%; width: 110vw; height: 110vh;
            background: url('FOTOS/759199906_122127072651351241_6293598853126747394_n.jpg') center center / cover no-repeat;
            background-attachment: fixed;
            filter: blur(4px) brightness(0.25) contrast(1.2); 
            z-index: -4;
        }

        .glass-reflection {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -3;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, transparent 40%, rgba(0, 0, 0, 0.9) 100%);
        }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -2; opacity: 0.08; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .cursor-glow {
            position: fixed; top: 0; left: 0; width: 400px; height: 400px; 
            border-radius: 50%; pointer-events: none; z-index: 9998;
            transform: translate3d(-50%, -50%, 0);
            background: radial-gradient(circle, rgba(227, 218, 201, 0.12) 0%, transparent 60%);
        }

        /* --- TARJETA PRINCIPAL Y COMPONENTES --- */
        .glass-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
            z-index: 2;
        }

        .badge {
            background: rgba(227, 218, 201, 0.1); color: var(--accent-color);
            padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
            display: inline-block; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px;
            border: 1px solid rgba(227, 218, 201, 0.2);
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(227, 218, 201, 0.3);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .stats-bar {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
        }

        .stats-bar div {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 500;
        }

        .stats-bar div span {
            display: block;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text-main);
            margin-top: 2px;
        }

        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: rgba(0,0,0,0.5);
        }

        .result-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            display: none;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease-in-out;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .valid { background-color: var(--status-valid); color: #fff; box-shadow: 0 0 25px rgba(35, 134, 54, 0.4); }
        .invalid { background-color: var(--status-invalid); color: #fff; box-shadow: 0 0 25px rgba(218, 54, 51, 0.4); }
        .used { background-color: var(--status-used); color: #fff; box-shadow: 0 0 25px rgba(217, 119, 6, 0.4); }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .pill-btn {
            background: var(--accent-color); color: #000000;
            padding: 12px 24px; border-radius: 50px; font-weight: 700;
            border: none; cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem; text-align: center;
        }
        .pill-btn:hover { background: #E3DAC9; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(227, 218, 201, 0.3); }

        .btn-outline { background: transparent; border: 1px solid rgba(227, 218, 201, 0.3); color: var(--text-main); }
        .btn-outline:hover { background: rgba(227, 218, 201, 0.08); border-color: rgba(227, 218, 201, 0.6); }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 0.75rem;
            margin-top: 15px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-reset:hover { color: var(--text-main); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <div class="site-bg-image"></div>
    <div class="glass-reflection"></div>
    <div class="noise-overlay"></div>
    <div class="cursor-glow" id="cursor-glow"></div>

    <div class="glass-card">
        <div class="badge">Control de Acceso</div>
        <h2>ELEGIDOS</h2>
        <div class="subtitle">Validador de Tickets 2026</div>

        <div class="stats-bar">
            <div>Total<span id="stat-total">200</span></div>
            <div>Ingresados<span id="stat-usados" style="color: var(--accent-color);">0</span></div>
            <div>Restantes<span id="stat-restantes">200</span></div>
        </div>
        
        <div id="reader"></div>

        <div id="result" class="result-box"></div>

        <div class="btn-group">
            <button class="pill-btn" onclick="reiniciarEscaner()">Escanear Siguiente Ticket</button>
            <button class="pill-btn btn-outline" onclick="exportarReporte()">Descargar Reporte CSV ↗</button>
        </div>

        <button class="btn-reset" onclick="resetearBaseDatos()">Reiniciar todos los tickets a 0</button>
    </div>

<script>
    // 1. GENERAR BASE DE DATOS INICIAL DE LOS 200 TICKETS (ELEGIDOS-2026-001 al 200)
    function generarTicketsBase() {
        let base = {};
        for (let i = 1; i <= 200; i++) {
            let num = String(i).padStart(3, '0');
            let codigo = `ELEGIDOS-2026-${num}`;
            base[codigo] = { usado: false, fechaIngreso: null };
        }
        return base;
    }

    let dbTickets = JSON.parse(localStorage.getItem('dbTickets_ELEGIDOS')) || generarTicketsBase();

    function actualizarEstadisticas() {
        const total = Object.keys(dbTickets).length;
        const usados = Object.values(dbTickets).filter(t => t.usado).length;
        
        document.getElementById('stat-total').innerText = total;
        document.getElementById('stat-usados').innerText = usados;
        document.getElementById('stat-restantes').innerText = total - usados;
    }

    function guardarBaseDatos() {
        localStorage.setItem('dbTickets_ELEGIDOS', JSON.stringify(dbTickets));
        actualizarEstadisticas();
    }

    let html5QrcodeScanner;

    function onScanSuccess(decodedText) {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.clear();
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        const token = decodedText.trim();

        if (dbTickets[token]) {
            if (dbTickets[token].usado) {
                resultDiv.className = "result-box used";
                resultDiv.innerHTML = `⚠️ TICKET YA USADO<br><small style="font-size:0.8rem; font-weight:normal;">Código: ${token}</small><br><small style="font-size:0.75rem; font-weight:normal;">Hora: ${dbTickets[token].fechaIngreso}</small>`;
            } else {
                const horaActual = new Date().toLocaleTimeString();
                dbTickets[token].usado = true;
                dbTickets[token].fechaIngreso = horaActual;
                guardarBaseDatos();

                resultDiv.className = "result-box valid";
                resultDiv.innerHTML = `✅ ACCESO CONCEDIDO<br><small style="font-size:0.8rem; font-weight:normal;">Código: ${token}</small>`;
            }
        } else {
            resultDiv.className = "result-box invalid";
            resultDiv.innerHTML = `❌ CÓDIGO INVÁLIDO<br><small style="font-size:0.8rem; font-weight:normal;">${token}</small>`;
        }
    }

    function inicializarEscaner() {
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: { width: 220, height: 220 } }, 
            false
        );
        html5QrcodeScanner.render(onScanSuccess);
    }

    function reiniciarEscaner() {
        document.getElementById('result').style.display = 'none';
        inicializarEscaner();
    }

    function exportarReporte() {
        let csvContent = "data:text/csv;charset=utf-8,Codigo,Estado,Hora_Ingreso\n";
        for (let id in dbTickets) {
            let t = dbTickets[id];
            csvContent += `${id},${t.usado ? 'INGRESADO' : 'NO ASISTIO'},${t.fechaIngreso || '-'}\n`;
        }
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "reporte_asistencia_elegidos.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function resetearBaseDatos() {
        if (confirm("¿Seguro que quieres borrar los registros de ingreso y reiniciar a 0?")) {
            dbTickets = generarTicketsBase();
            guardarBaseDatos();
            alert("Base de datos reiniciada.");
        }
    }

    // --- DESTELLO DE CURSOR ---
    const cursorGlow = document.getElementById('cursor-glow');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let glowX = mouseX, glowY = mouseY;
    let isMobile = window.innerWidth <= 900;

    if (!isMobile) {
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        function animateCursor() {
            glowX += (mouseX - glowX) * 0.15;
            glowY += (mouseY - glowY) * 0.15;
            cursorGlow.style.transform = `translate3d(calc(${glowX}px - 50%), calc(${glowY}px - 50%), 0)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();
    } else {
        cursorGlow.style.display = 'none';
    }

    window.onload = () => {
        actualizarEstadisticas();
        inicializarEscaner();
    };
</script>

</body>
</html>
