    <style>
        :root {
            --bg-color: #000000; 
            --card-bg: rgba(15, 15, 15, 0.65); 
            --card-border: rgba(227, 218, 201, 0.15); 
            --text-main: #E3DAC9; 
            --text-muted: #9c978e;
            --accent-color: #D5C7A3; 
            --accent-blue: #1f6beb;
            --accent-purple: #9333ea;
            --accent-gold: #fbbf24;
            --status-valid: rgba(35, 134, 54, 0.85);
            --status-used: rgba(217, 119, 6, 0.85);
            --status-invalid: rgba(218, 54, 51, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .site-bg-image {
            position: fixed; top: -5%; left: -5%; width: 110vw; height: 110vh;
            background: url('FOTOS/759199906_122127072651351241_6293598853126747394_n.jpg') center center / cover no-repeat;
            background-attachment: fixed;
            filter: blur(4px) brightness(0.25) contrast(1.2); 
            z-index: -4;
        }

        .glass-reflection {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -3;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, transparent 40%, rgba(0, 0, 0, 0.9) 100%);
        }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -2; opacity: 0.08; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .cursor-glow {
            position: fixed; top: 0; left: 0; width: 400px; height: 400px; 
            border-radius: 50%; pointer-events: none; z-index: 9998;
            transform: translate3d(-50%, -50%, 0);
            background: radial-gradient(circle, rgba(227, 218, 201, 0.12) 0%, transparent 60%);
        }

        .glass-card {
            width: 100%; max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px; padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center; z-index: 2;
        }

        .badge {
            background: rgba(227, 218, 201, 0.1); color: var(--accent-color);
            padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
            display: inline-block; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px;
            border: 1px solid rgba(227, 218, 201, 0.2);
        }

        h2 { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: var(--text-main); text-transform: uppercase; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }

        #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid var(--card-border); background: rgba(0,0,0,0.5); }

        .result-box {
            margin-top: 20px; padding: 18px; border-radius: 12px; font-size: 1.1rem; font-weight: 700;
            display: none; backdrop-filter: blur(10px); animation: fadeIn 0.3s ease-in-out; border: 1px solid rgba(255,255,255,0.2);
        }

        .valid { background-color: var(--status-valid); color: #fff; box-shadow: 0 0 25px rgba(35, 134, 54, 0.4); }
        .invalid { background-color: var(--status-invalid); color: #fff; box-shadow: 0 0 25px rgba(218, 54, 51, 0.4); }
        .used { background-color: var(--status-used); color: #fff; box-shadow: 0 0 25px rgba(217, 119, 6, 0.4); }

        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .pill-btn {
            background: var(--accent-color); color: #000000; padding: 12px 24px; border-radius: 50px;
            font-weight: 700; border: none; cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem; text-align: center;
        }
        .pill-btn:hover { background: #E3DAC9; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(227, 218, 201, 0.3); }

        .btn-outline { background: transparent; border: 1px solid rgba(227, 218, 201, 0.3); color: var(--text-main); }
        .btn-outline:hover { background: rgba(227, 218, 201, 0.08); border-color: rgba(227, 218, 201, 0.6); }

        .btn-reset { background: transparent; color: var(--text-muted); border: none; font-size: 0.75rem; margin-top: 15px; cursor: pointer; }
        .btn-reset:hover { color: var(--text-main); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    </style>

            </div>

        <button class="btn-reset" onclick="resetearBaseDatosModo()">Reiniciar TODA la base de datos general</button>
    </div>

<script>

    let dbCache = { clase: {}, elegidos: {}, masterclass: {}, festival: {} }; 
    let isScanning = false; // Seguro anti-duplicados

    function inicializarNubeSiEsNecesario() {
        // 1. CLASE (Múltiples ingresos por fecha)
        db.ref('clase').once('value', (snapshot) => {
            if (!snapshot.exists()) {
                let base = {};
                for (let i = 1; i <= 200; i++) {
                    let num = String(i).padStart(3, '0');
                    let codigo = `CLASE-2026-${num}`;
                    let nombreAsignado = (i - 1 < alumnosInscritos.length) ? alumnosInscritos[i - 1] : `Entrada General Clase #${i}`;
                    base[codigo] = { tipo: 'ASISTENCIA CLASE', nombre: nombreAsignado }; // 'asistencias' se creará al escanear
                }
                db.ref('clase').set(base);
            }
        });

        // 2, 3 y 4. (Un solo uso)
        const eventosUnicoUso = [
            { id: 'elegidos', prefijo: 'ELEGIDOS-2026-', tipo: 'ENTRADA ELEGIDOS', desc: 'Entrada General Elegidos' },
            { id: 'masterclass', prefijo: 'DREAMEZ-2026-', tipo: 'MASTERCLASS DREAMEZ', desc: 'Entrada General Masterclass' },
            { id: 'festival', prefijo: 'FESTIVAL-2026-', tipo: 'FESTIVAL CREATIVO', desc: 'Entrada General Festival' }
        ];

        eventosUnicoUso.forEach(evento => {
            db.ref(evento.id).once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    let base = {};
                    for (let i = 1; i <= 200; i++) {
                        let num = String(i).padStart(3, '0');
                        let codigo = `${evento.prefijo}${num}`;
                        base[codigo] = { tipo: evento.tipo, nombre: `${evento.desc} #${i}`, usado: false, fechaIngreso: null };
                    }
                    db.ref(evento.id).set(base);
                }
            });
        });
    }

    function escucharCambiosEnTiempoReal() {
        ['clase', 'elegidos', 'masterclass', 'festival'].forEach(seccion => {
            db.ref(seccion).on('value', (snapshot) => {
                if (snapshot.exists()) dbCache[seccion] = snapshot.val();
            });
        });
    }

    let html5QrcodeScanner;

    function onScanSuccess(decodedText) {
        if (isScanning) return; // Si ya está procesando un código, ignora los siguientes mili-segundos
        isScanning = true;

        if (html5QrcodeScanner) {
            html5QrcodeScanner.clear().catch(e => console.log(e));
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        const token = decodedText.trim();
        let modoDetectado = null;
        let colorFondo = "";

        if (token.startsWith("CLASE-2026-")) { modoDetectado = 'clase'; colorFondo = "var(--accent-blue)"; }
        else if (token.startsWith("ELEGIDOS-2026-")) { modoDetectado = 'elegidos'; colorFondo = "var(--accent-gold)"; }
        else if (token.startsWith("DREAMEZ-2026-")) { modoDetectado = 'masterclass'; colorFondo = "var(--accent-purple)"; }
        else if (token.startsWith("FESTIVAL-2026-")) { modoDetectado = 'festival'; colorFondo = "var(--status-valid)"; }

        if (modoDetectado && dbCache[modoDetectado] && dbCache[modoDetectado][token]) {
            let registro = dbCache[modoDetectado][token];
            const horaActual = new Date().toLocaleTimeString();
            const fechaHoy = new Date().toISOString().split('T')[0]; // Genera: YYYY-MM-DD

            if (modoDetectado === 'clase') {
                // LOGICA DE ASISTENCIA POR DÍA
                if (registro.asistencias && registro.asistencias[fechaHoy]) {
                    mostrarPantalla(resultDiv, false, registro.nombre, token, `Hora: ${registro.asistencias[fechaHoy]} | HOY`, modoDetectado, "var(--status-used)");
                } else {
                    db.ref(`clase/${token}/asistencias/${fechaHoy}`).set(horaActual).then(() => {
                        mostrarPantalla(resultDiv, true, registro.nombre, token, "", modoDetectado, colorFondo);
                    });
                }
            } else {
                // LOGICA DE USO ÚNICO
                if (registro.usado) {
                    mostrarPantalla(resultDiv, false, registro.nombre, token, `Hora: ${registro.fechaIngreso}`, modoDetectado, "var(--status-used)");
                } else {
                    db.ref(`${modoDetectado}/${token}`).update({ usado: true, fechaIngreso: horaActual }).then(() => {
                        mostrarPantalla(resultDiv, true, registro.nombre, token, "", modoDetectado, colorFondo);
                    });
                }
            }
        } else {
            resultDiv.className = "result-box invalid";
            resultDiv.style.backgroundColor = "var(--status-invalid)";
            resultDiv.innerHTML = `❌ CÓDIGO NO VÁLIDO<br><small style="font-size:0.8rem; font-weight:normal;">${token}</small>`;
        }
    }

    function mostrarPantalla(div, exito, nombre, token, infoExtra, modo, colorFondo) {
        div.style.backgroundColor = colorFondo;
        if (exito) {
            div.className = "result-box valid";
            div.innerHTML = `✅ ACCESO CONCEDIDO<br>
            <h3 style="margin: 8px 0; color: #fff; font-size:1.4rem; text-transform: uppercase;">${nombre}</h3>
            <small style="color:rgba(255,255,255,0.9); font-size:0.9rem;">Cód: ${token}</small><br>
            <small style="color:rgba(255,255,255,0.9); font-size:0.8rem; font-weight:normal;">Sección: ${modo.toUpperCase()}</small>`;
        } else {
            div.className = "result-box used";
            div.innerHTML = `⚠️ YA INGRESÓ ANTERIORMENTE<br>
            <h3 style="margin: 8px 0; color: #fff; font-size:1.2rem;">${nombre}</h3>
            <small style="color:rgba(255,255,255,0.7); font-size:0.8rem;">(${token})</small><br>
            <small style="font-size:0.75rem; font-weight:normal;">${infoExtra} | ${modo.toUpperCase()}</small>`;
        }
    }

    function resetearCodigoManual() {
        const inputField = document.getElementById('input-reset-codigo');
        let token = inputField.value.trim().toUpperCase();
        if(!token) return;

        let modoDetectado = null;
        if (token.startsWith("CLASE-2026-")) modoDetectado = 'clase';
        else if (token.startsWith("ELEGIDOS-2026-")) modoDetectado = 'elegidos';
        else if (token.startsWith("DREAMEZ-2026-")) modoDetectado = 'masterclass';
        else if (token.startsWith("FESTIVAL-2026-")) modoDetectado = 'festival';

        if (modoDetectado && dbCache[modoDetectado] && dbCache[modoDetectado][token]) {
            if (modoDetectado === 'clase') {
                const fechaHoy = new Date().toISOString().split('T')[0];
                db.ref(`clase/${token}/asistencias/${fechaHoy}`).remove().then(() => {
                    alert(`✅ Se anuló la asistencia de HOY para el código: ${token}`);
                    inputField.value = '';
                });
            } else {
                db.ref(`${modoDetectado}/${token}`).update({ usado: false, fechaIngreso: null }).then(() => {
                    alert(`✅ Código restablecido (No Usado): ${token}`);
                    inputField.value = '';
                });
            }
        } else {
            alert("❌ Código no válido o no encontrado en la base de datos.");
        }
    }

    function inicializarEscaner() {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } }, false);
        html5QrcodeScanner.render(onScanSuccess);
    }

    function reiniciarEscaner() {
        isScanning = false;
        document.getElementById('result').style.display = 'none';
        inicializarEscaner();
    }

    function exportarReporte() {
        let csvContent = "data:text/csv;charset=utf-8,Codigo,Nombre,Tipo,Estado,Hora_Ingreso,Apartado\n";
        const fechaHoy = new Date().toISOString().split('T')[0];
        
        ['clase', 'elegidos', 'masterclass', 'festival'].forEach(modo => {
            let data = dbCache[modo];
            for (let id in data) {
                let t = data[id];
                if (modo === 'clase') {
                    let asistioHoy = (t.asistencias && t.asistencias[fechaHoy]) ? 'ASISTIÓ HOY' : 'NO ASISTIÓ HOY';
                    let hora = (t.asistencias && t.asistencias[fechaHoy]) ? t.asistencias[fechaHoy] : '-';
                    csvContent += `${id},"${t.nombre}",${t.tipo},${asistioHoy},${hora},${modo.toUpperCase()}\n`;
                } else {
                    csvContent += `${id},"${t.nombre}",${t.tipo},${t.usado ? 'INGRESADO' : 'NO ASISTIO'},${t.fechaIngreso || '-'},${modo.toUpperCase()}\n`;
                }
            }
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `reporte_general_eventos_tiempo_real.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function resetearBaseDatosModo() {
        if (confirm(`¿Seguro que quieres borrar todos los registros en la nube de TODOS los apartados (Clase, Elegidos, Masterclass y Festival)?`)) {
            Promise.all([
                db.ref('clase').remove(), db.ref('elegidos').remove(), db.ref('masterclass').remove(), db.ref('festival').remove()
            ]).then(() => {
                inicializarNubeSiEsNecesario();
                alert("Base de datos reiniciada correctamente para todos los apartados.");
                document.getElementById('result').style.display = 'none';
            });
        }
    }

    // --- EFECTO CURSOR ---
    const cursorGlow = document.getElementById('cursor-glow');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let glowX = mouseX, glowY = mouseY;
    let isMobile = window.innerWidth <= 900;

    if (!isMobile) {
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        function animateCursor() {
            glowX += (mouseX - glowX) * 0.15;
            glowY += (mouseY - glowY) * 0.15;
            cursorGlow.style.transform = `translate3d(calc(${glowX}px - 50%), calc(${glowY}px - 50%), 0)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();
    } else {
        cursorGlow.style.display = 'none';
    }

    window.onload = () => {
        inicializarNubeSiEsNecesario();
        escucharCambiosEnTiempoReal();
        inicializarEscaner();
    };
</script>
