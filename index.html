    function playFeedback(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'success') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
            oscillator.stop(audioCtx.currentTime + 0.2);
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]); 
        } else {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(250, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

    function inicializarNubeSiEsNecesario() {

                    for (let i = 1; i <= 200; i++) {

    function escucharCambiosEnTiempoReal() {
        ['clase', 'elegidos', 'masterclass', 'festival'].forEach(seccion => {

                if (snapshot.exists()) {

                    actualizarEstadisticas();
                    actualizarDatalist();
                }
            });
        });

            const data = snapshot.val();
            // Evitar mostrar el propio escaneo si ya vimos la pantalla grande

            // Limpiar la base para no llenarla (se borra a los 5 min, pero por si acaso)
            if (Date.now() - data.timestamp > 300000) snapshot.ref.remove();

    function mostrarFeedNotificacion(nombre, codigo, tipo) {
        const feedContainer = document.getElementById("live-feed");
        const item = document.createElement("div");
        item.className = "feed-item";
        item.innerHTML = `<strong>${nombre}</strong> <span style="color:#aaa;">${codigo}</span><br><small>${tipo}</small>`;
        
        feedContainer.prepend(item);
        
        // Quitar del DOM después de 4.5 segundos
        setTimeout(() => {
            if (item.parentNode) item.parentNode.removeChild(item);
        }, 4500);
    }

    function enviarPingFeed(nombre, codigo, tipo) {
        db.ref('live_feed').push({
            nombre: nombre,
            codigo: codigo,
            tipoEvento: tipo,
            scannerId: scannerId,
            timestamp: Date.now()
        });
        // Mostrar localmente también en pequeño
        mostrarFeedNotificacion(nombre, codigo, tipo);
    }

    function actualizarEstadisticas() {
        const fechaHoy = new Date().toISOString().split('T')[0];
        const isTestMode = document.getElementById("test-mode-checkbox").checked;
        let counts = { clase: 0, elegidos: 0, masterclass: 0, festival: 0 };
        let totals = { clase: 200, elegidos: 200, masterclass: 200, festival: 200 }; 

        if (dbCache.clase) {
            Object.values(dbCache.clase).forEach(t => { if (t.asistencias && t.asistencias[fechaHoy]) counts.clase++; });
        }
        ['elegidos', 'masterclass', 'festival'].forEach(sec => {
            if (dbCache[sec]) {
                Object.values(dbCache[sec]).forEach(t => { if (t.usado) counts[sec]++; });
            }
        });

        document.getElementById("row-elegidos").style.display = (fechaHoy === FECHAS_PERMITIDAS.elegidos || isTestMode) ? "flex" : "none";
        document.getElementById("row-master").style.display = (fechaHoy === FECHAS_PERMITIDAS.masterclass || isTestMode) ? "flex" : "none";
        document.getElementById("row-festival").style.display = (fechaHoy === FECHAS_PERMITIDAS.festival || isTestMode) ? "flex" : "none";

        document.getElementById("stat-clase").innerText = `${counts.clase}/${totals.clase} (${Math.round(counts.clase/totals.clase*100)}%)`;
        document.getElementById("stat-elegidos").innerText = `${counts.elegidos}/${totals.elegidos} (${Math.round(counts.elegidos/totals.elegidos*100)}%)`;
        document.getElementById("stat-master").innerText = `${counts.masterclass}/${totals.masterclass} (${Math.round(counts.masterclass/totals.masterclass*100)}%)`;
        document.getElementById("stat-festival").innerText = `${counts.festival}/${totals.festival} (${Math.round(counts.festival/totals.festival*100)}%)`;
    }

    document.getElementById("test-mode-checkbox").addEventListener("change", actualizarEstadisticas);

    function actualizarDatalist() {
        const datalist = document.getElementById('lista-asistentes');
        datalist.innerHTML = '';
        ['clase', 'elegidos', 'masterclass', 'festival'].forEach(sec => {
            if (dbCache[sec]) {
                Object.entries(dbCache[sec]).forEach(([id, data]) => {
                    let option = document.createElement('option');
                    option.value = id; 
                    option.textContent = data.nombre; 
                    datalist.appendChild(option);
                });
            }
        });
    }

    function validarManual() {
        const input = document.getElementById("input-busqueda-manual");
        let query = input.value.trim();
        if(!query) return;

        let tokenFinal = query.toUpperCase();
        ['clase', 'elegidos', 'masterclass', 'festival'].forEach(sec => {
            if (dbCache[sec]) {
                Object.entries(dbCache[sec]).forEach(([id, data]) => {
                    if (data.nombre.toLowerCase() === query.toLowerCase() || id === query.toUpperCase()) {
                        tokenFinal = id;
                    }
                });
            }
        });

        onScanSuccess(tokenFinal);
        input.value = '';
    }

    function onScanSuccess(decodedText) {
        if (isScanning) return; 
        isScanning = true;

        if (html5QrcodeScanner) {
            // Pausar en lugar de limpiar para mantener la linterna viva si es posible, o limpiar si es necesario
            html5QrcodeScanner.pause(true); 
            document.getElementById('btn-linterna').style.display = 'none';
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        document.getElementById('reader').style.display = 'none'; // Ocultar cámara al validar

        const token = decodedText.trim();
        let modoDetectado = null;
        let colorFondo = "";

        if (token.startsWith("CLASE-2026-")) { modoDetectado = 'clase'; colorFondo = "var(--accent-blue)"; }
        else if (token.startsWith("ELEGIDOS-2026-")) { modoDetectado = 'elegidos'; colorFondo = "var(--accent-gold)"; }
        else if (token.startsWith("DREAMEZ-2026-")) { modoDetectado = 'masterclass'; colorFondo = "var(--accent-purple)"; }
        else if (token.startsWith("FESTIVAL-2026-")) { modoDetectado = 'festival'; colorFondo = "var(--status-valid)"; }

        const isTestMode = document.getElementById("test-mode-checkbox").checked;
        const fechaHoy = new Date().toISOString().split('T')[0];
        
        if (modoDetectado && modoDetectado !== 'clase' && !isTestMode) {
            if (FECHAS_PERMITIDAS[modoDetectado] !== fechaHoy) {
                playFeedback('error');
                resultDiv.className = "result-box invalid";
                resultDiv.style.backgroundColor = "var(--status-invalid)";
                resultDiv.innerHTML = `❌ ACCESO DENEGADO<br>
                <small style="font-size:0.85rem; font-weight:normal; display:block; margin-top:8px;">Este código es válido únicamente el día:</small>
                <strong style="font-size:1rem;">${FECHAS_PERMITIDAS[modoDetectado]}</strong><br>
                <small style="font-size:0.75rem; color:rgba(255,255,255,0.7);">${token}</small>`;
                return;
            }
        }

        if (modoDetectado && dbCache[modoDetectado] && dbCache[modoDetectado][token]) {
            let registro = dbCache[modoDetectado][token];
            const horaActual = new Date().toLocaleTimeString();

            if (modoDetectado === 'clase') {
                if (registro.asistencias && registro.asistencias[fechaHoy]) {
                    mostrarPantalla(resultDiv, false, registro.nombre, token, `Hora: ${registro.asistencias[fechaHoy]} | HOY`, modoDetectado, "var(--status-used)", registro.tipo);
                } else {
                    db.ref(`clase/${token}/asistencias/${fechaHoy}`).set(horaActual).then(() => {
                        mostrarPantalla(resultDiv, true, registro.nombre, token, "", modoDetectado, colorFondo, registro.tipo);
                        enviarPingFeed(registro.nombre, token, registro.tipo);
                    });
                }
            } else {
                if (registro.usado) {
                    mostrarPantalla(resultDiv, false, registro.nombre, token, `Hora: ${registro.fechaIngreso}`, modoDetectado, "var(--status-used)", registro.tipo);
                } else {
                    db.ref(`${modoDetectado}/${token}`).update({ usado: true, fechaIngreso: horaActual }).then(() => {
                        mostrarPantalla(resultDiv, true, registro.nombre, token, "", modoDetectado, colorFondo, registro.tipo);
                        enviarPingFeed(registro.nombre, token, registro.tipo);
                    });
                }
            }
        } else {
            playFeedback('error');
            resultDiv.className = "result-box invalid";
            resultDiv.style.backgroundColor = "var(--status-invalid)";
            resultDiv.innerHTML = `❌ CÓDIGO NO VÁLIDO<br><small style="font-size:0.8rem; font-weight:normal;">${token}</small>`;
        }
    }

    function mostrarPantalla(div, exito, nombre, token, infoExtra, modo, colorFondo, tipoEvento) {
        div.style.backgroundColor = colorFondo;
        
        let imagenTicketHtml = "";
        if (TICKET_IMAGES[modo]) {
            imagenTicketHtml = `
            <div style="margin-top: 15px; text-align: center; animation: fadeIn 0.5s ease-in-out;">
                <img src="${TICKET_IMAGES[modo]}" alt="Ticket ${tipoEvento}" 
                     style="max-width: 100%; height: auto; max-height: 220px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); object-fit: contain; border: 1px solid rgba(255,255,255,0.2);"
                     onerror="this.style.display='none'">
            </div>`;
        }
        
        if (exito) {
            playFeedback('success');
            div.className = "result-box valid";
            div.innerHTML = `✅ ACCESO CONCEDIDO<br>
            <h3 style="margin: 8px 0; color: #fff; font-size:1.4rem; text-transform: uppercase;">${nombre}</h3>
            <small style="color:rgba(255,255,255,0.9); font-size:0.9rem;">Cód: ${token}</small><br>
            <small style="color:rgba(255,255,255,0.9); font-size:0.8rem; font-weight:normal;">Sección: ${tipoEvento}</small>
            ${imagenTicketHtml}`;
        } else {
            playFeedback('error');
            div.className = "result-box used";
            div.innerHTML = `⚠️ YA INGRESÓ ANTERIORMENTE<br>
            <h3 style="margin: 8px 0; color: #fff; font-size:1.2rem;">${nombre}</h3>
            <small style="color:rgba(255,255,255,0.7); font-size:0.8rem;">(${token})</small><br>
            <small style="font-size:0.75rem; font-weight:normal;">${infoExtra} | ${tipoEvento}</small>`;
        }
    }    

    function toggleLinterna() {
        if (!html5QrcodeScanner) return;
        scanModeTorchOn = !scanModeTorchOn;
        const btn = document.getElementById('btn-linterna');
        
        html5QrcodeScanner.applyVideoConstraints({
            advanced: [{ torch: scanModeTorchOn }]
        }).then(() => {
            btn.style.background = scanModeTorchOn ? "var(--accent-color)" : "transparent";
            btn.style.color = scanModeTorchOn ? "#000" : "var(--accent-color)";
        }).catch(err => {
            alert("Tu dispositivo o navegador no soporta la función de linterna.");
            scanModeTorchOn = false;
        });
    }

    function inicializarEscaner() {
        const config = { 
            fps: 10, 
            qrbox: { width: 250, height: 250 }
        };

        if(!html5QrcodeScanner) {
            html5QrcodeScanner = new Html5Qrcode("reader");
        }

        // Obtener todas las cámaras antes de iniciar para evitar el Gran Angular
        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                let camId = devices[0].id;
                
                // Filtramos para buscar cámaras traseras
                let backCams = devices.filter(c => c.label.toLowerCase().includes('back') || c.label.toLowerCase().includes('trasera') || c.label.toLowerCase().includes('posterior'));
                
                if (backCams.length > 0) {
                    // Excluir específicamente lentes gran angular, ultra wide o macro
                    let mainBack = backCams.find(c => !c.label.toLowerCase().includes('ultra') && !c.label.toLowerCase().includes('wide') && !c.label.toLowerCase().includes('angular') && !c.label.toLowerCase().includes('gran') && !c.label.toLowerCase().includes('macro'));
                    
                    camId = mainBack ? mainBack.id : backCams[0].id; 
                } else if (devices.length > 1) {
                    // Si el navegador no da labels claros, suele ser la última de la lista
                    camId = devices[devices.length - 1].id;
                }

                iniciarConCamara(camId, config);
            } else {
                iniciarConCamara({ facingMode: "environment" }, config);
            }
        }).catch(err => {
            console.log("Error al listar cámaras: ", err);
            iniciarConCamara({ facingMode: "environment" }, config);
        });
    }

    // Función auxiliar para mantener el código limpio sin repetir promesas
    function iniciarConCamara(cameraParams, config) {
        html5QrcodeScanner.start(cameraParams, config, onScanSuccess)
        .then(() => {
            document.getElementById('btn-linterna').style.display = 'block';
            document.getElementById('btn-linterna').style.background = 'transparent';
            document.getElementById('btn-linterna').style.color = 'var(--accent-color)';
            scanModeTorchOn = false;
        }).catch(err => {
            console.log("Error al iniciar cámara principal: ", err);
            // Fallback final si falla la cámara específica
            if (cameraParams !== undefined && cameraParams.facingMode === undefined) {
                html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess).catch(e => console.log(e));
            }
        });
    }

    function reiniciarEscaner() {
        isScanning = false;
        document.getElementById('result').style.display = 'none';
        document.getElementById('reader').style.display = 'block';
        
        if (html5QrcodeScanner && html5QrcodeScanner.getState() === 3 /* PAUSED */) {
            html5QrcodeScanner.resume();
            document.getElementById('btn-linterna').style.display = 'block';
        } else {
            inicializarEscaner();
        }
    }

    function resetearCodigoManual() {
        const inputField = document.getElementById('input-reset-codigo');
        let token = inputField.value.trim().toUpperCase();
        if(!token) return;

        let modoDetectado = null;
        if (token.startsWith("CLASE-2026-")) modoDetectado = 'clase';
        else if (token.startsWith("ELEGIDOS-2026-")) modoDetectado = 'elegidos';
        else if (token.startsWith("DREAMEZ-2026-")) modoDetectado = 'masterclass';
        else if (token.startsWith("FESTIVAL-2026-")) modoDetectado = 'festival';

        if (modoDetectado && dbCache[modoDetectado] && dbCache[modoDetectado][token]) {
            if (modoDetectado === 'clase') {
                const fechaHoy = new Date().toISOString().split('T')[0];
                db.ref(`clase/${token}/asistencias/${fechaHoy}`).remove().then(() => {
                    alert(`✅ Se anuló la asistencia de HOY para el código: ${token}`);
                    inputField.value = '';
                });
            } else {
                db.ref(`${modoDetectado}/${token}`).update({ usado: false, fechaIngreso: null }).then(() => {
                    alert(`✅ Código restablecido (No Usado): ${token}`);
                    inputField.value = '';
                });
            }
        } else {
            alert("❌ Código no válido o no encontrado en la base de datos.");
        }
    }

    function exportarReporte() {
        const selector = document.getElementById('export-filter');
        const filtro = selector.value;
        if (!filtro) return;

        let csvContent = "data:text/csv;charset=utf-8,Codigo,Nombre,Tipo,Estado,Hora_Ingreso,Apartado\n";
        const fechaHoy = new Date().toISOString().split('T')[0];
        
        const modosARevisar = filtro === 'todos' ? ['clase', 'elegidos', 'masterclass', 'festival'] : [filtro];

        modosARevisar.forEach(modo => {
            let data = dbCache[modo];
            for (let id in data) {
                let t = data[id];
                if (modo === 'clase') {
                    let asistioHoy = (t.asistencias && t.asistencias[fechaHoy]) ? 'ASISTIÓ HOY' : 'NO ASISTIÓ HOY';
                    let hora = (t.asistencias && t.asistencias[fechaHoy]) ? t.asistencias[fechaHoy] : '-';
                    csvContent += `${id},"${t.nombre}",${t.tipo},${asistioHoy},${hora},${modo.toUpperCase()}\n`;
                } else {
                    csvContent += `${id},"${t.nombre}",${t.tipo},${t.usado ? 'INGRESADO' : 'NO ASISTIO'},${t.fechaIngreso || '-'},${modo.toUpperCase()}\n`;
                }
            }
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `reporte_${filtro}_${fechaHoy}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        selector.value = ""; // Resetear selector
    }

    function resetearBaseDatosModo() {
        if (confirm(`¿Seguro que quieres borrar todos los registros en la nube de TODOS los apartados?`)) {
            Promise.all([
                db.ref('clase').remove(), db.ref('elegidos').remove(), db.ref('masterclass').remove(), db.ref('festival').remove()
            ]).then(() => {
                inicializarNubeSiEsNecesario();
                alert("Base de datos reiniciada correctamente para todos los apartados.");
                document.getElementById('result').style.display = 'none';
            });
        }
    }

    // --- EFECTO CURSOR ---
    const cursorGlow = document.getElementById('cursor-glow');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let glowX = mouseX, glowY = mouseY;
    let isMobile = window.innerWidth <= 900;

    if (!isMobile) {
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        function animateCursor() {
            glowX += (mouseX - glowX) * 0.15;
            glowY += (mouseY - glowY) * 0.15;
            cursorGlow.style.transform = `translate3d(calc(${glowX}px - 50%), calc(${glowY}px - 50%), 0)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();
    } else {
        cursorGlow.style.display = 'none';
    }

    window.onload = () => {
        inicializarNubeSiEsNecesario();
        escucharCambiosEnTiempoReal();
        inicializarEscaner();
    };
</script>
