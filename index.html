        .cursor-glow {
            position: fixed; top: 0; left: 0; width: 400px; height: 400px;

            transform: translate3d(-50%, -50%, 0);
            background: radial-gradient(circle, rgba(227, 218, 201, 0.12) 0%, transparent 60%);

        .glass-card {
            width: 100%; max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px; padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center; z-index: 2;
        }

        .badge {
            background: rgba(227, 218, 201, 0.1); color: var(--accent-color);
            padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
            display: inline-block; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px;
            border: 1px solid rgba(227, 218, 201, 0.2);

        h2 { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: var(--text-main); text-transform: uppercase; }

        #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid var(--card-border); background: rgba(0,0,0,0.5); }

            margin-top: 20px; padding: 18px; border-radius: 12px; font-size: 1.1rem; font-weight: 700;

        .valid { background-color: var(--status-valid); color: #fff; box-shadow: 0 0 25px rgba(35, 134, 54, 0.4); }
        .invalid { background-color: var(--status-invalid); color: #fff; box-shadow: 0 0 25px rgba(218, 54, 51, 0.4); }
        .used { background-color: var(--status-used); color: #fff; box-shadow: 0 0 25px rgba(217, 119, 6, 0.4); }

        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .pill-btn {
            background: var(--accent-color); color: #000000; padding: 12px 24px; border-radius: 50px;
            font-weight: 700; border: none; cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem; text-align: center;

        .btn-reset { background: transparent; color: var(--text-muted); border: none; font-size: 0.75rem; margin-top: 15px; cursor: pointer; }
        .btn-reset:hover { color: var(--text-main); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    let dbCache = {
        clase: {},

    // Inicializar datos en Firebase para los 4 apartados
    function inicializarNubeSiEsNecesario() {
        // 1. CLASE (CLASE-2026-xxx)
        db.ref('clase').once('value', (snapshot) => {
            if (!snapshot.exists()) {
                let base = {};
                for (let i = 0; i < 200; i++) {
                    let num = String(i + 1).padStart(3, '0');
                    let codigo = `CLASE-2026-${num}`;
                    let nombreAsignado = (i < alumnosInscritos.length) ? alumnosInscritos[i] : `Entrada General Clase #${(i - alumnosInscritos.length) + 1}`;
                    base[codigo] = { tipo: 'ASISTENCIA CLASE', nombre: nombreAsignado, usado: false, fechaIngreso: null };
                }
                db.ref('clase').set(base);
            }
        });

        // 2. ELEGIDOS (ELEGIDOS-2026-xxx)
        db.ref('elegidos').once('value', (snapshot) => {
            if (!snapshot.exists()) {
                let base = {};
                for (let i = 1; i <= 200; i++) {
                    let num = String(i).padStart(3, '0');
                    let codigo = `ELEGIDOS-2026-${num}`;
                    base[codigo] = { tipo: 'ENTRADA ELEGIDOS', nombre: `Entrada General Elegidos #${i}`, usado: false, fechaIngreso: null };
                }
                db.ref('elegidos').set(base);
            }
        });

        // 3. MASTERCLASS DREAMEZ (DREAMEZ-2026-xxx)
        db.ref('masterclass').once('value', (snapshot) => {
            if (!snapshot.exists()) {
                let base = {};
                for (let i = 1; i <= 200; i++) {
                    let num = String(i).padStart(3, '0');
                    let codigo = `DREAMEZ-2026-${num}`;
                    base[codigo] = { tipo: 'MASTERCLASS DREAMEZ', nombre: `Entrada General Masterclass #${i}`, usado: false, fechaIngreso: null };
                }
                db.ref('masterclass').set(base);
            }
        });

        // 4. FESTIVAL CREATIVO ELEGIDOS (FESTIVAL-2026-xxx)
        db.ref('festival').once('value', (snapshot) => {
            if (!snapshot.exists()) {
                let base = {};
                for (let i = 1; i <= 200; i++) {
                    let num = String(i).padStart(3, '0');
                    let codigo = `FESTIVAL-2026-${num}`;
                    base[codigo] = { tipo: 'FESTIVAL CREATIVO', nombre: `Entrada General Festival #${i}`, usado: false, fechaIngreso: null };
                }
                db.ref('festival').set(base);
            }
        });
    }

    function escucharCambiosEnTiempoReal() {
        db.ref('clase').on('value', (snapshot) => { if (snapshot.exists()) dbCache.clase = snapshot.val(); });
        db.ref('elegidos').on('value', (snapshot) => { if (snapshot.exists()) dbCache.elegidos = snapshot.val(); });
        db.ref('masterclass').on('value', (snapshot) => { if (snapshot.exists()) dbCache.masterclass = snapshot.val(); });
        db.ref('festival').on('value', (snapshot) => { if (snapshot.exists()) dbCache.festival = snapshot.val(); });
    }

    let html5QrcodeScanner;

    function onScanSuccess(decodedText) {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.clear();
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        const token = decodedText.trim();
        let modoDetectado = null;
        let colorFondo = "";

        // Detección automática según el prefijo del código
        if (token.startsWith("CLASE-2026-")) {
            modoDetectado = 'clase';
            colorFondo = "var(--accent-blue)";
        } else if (token.startsWith("ELEGIDOS-2026-")) {
            modoDetectado = 'elegidos';
            colorFondo = "var(--accent-gold)";
        } else if (token.startsWith("DREAMEZ-2026-")) {
            modoDetectado = 'masterclass';
            colorFondo = "var(--accent-purple)";
        } else if (token.startsWith("FESTIVAL-2026-")) {
            modoDetectado = 'festival';
            colorFondo = "var(--status-valid)";
        }

        if (modoDetectado && dbCache[modoDetectado] && dbCache[modoDetectado][token]) {
            let registro = dbCache[modoDetectado][token];

            if (registro.usado) {
                resultDiv.className = "result-box used";
                resultDiv.style.backgroundColor = "var(--status-used)";
                resultDiv.innerHTML = `⚠️ YA INGRESÓ ANTERIORMENTE<br>
                <h3 style="margin: 8px 0; color: #fff; font-size:1.2rem;">${registro.nombre}</h3>
                <small style="color:rgba(255,255,255,0.7); font-size:0.8rem;">(${token})</small><br>
                <small style="font-size:0.75rem; font-weight:normal;">Hora: ${registro.fechaIngreso} | ${modoDetectado.toUpperCase()}</small>`;
            } else {
                const horaActual = new Date().toLocaleTimeString();
                
                db.ref(`${modoDetectado}/${token}`).update({
                    usado: true,
                    fechaIngreso: horaActual
                }).then(() => {
                    resultDiv.style.backgroundColor = colorFondo;
                    resultDiv.className = "result-box valid";
                    resultDiv.innerHTML = `✅ ACCESO CONCEDIDO<br>
                    <h3 style="margin: 8px 0; color: #fff; font-size:1.4rem; text-transform: uppercase;">${registro.nombre}</h3>
                    <small style="color:rgba(255,255,255,0.9); font-size:0.9rem;">Cód: ${token}</small><br>
                    <small style="color:rgba(255,255,255,0.9); font-size:0.8rem; font-weight:normal;">Sección: ${modoDetectado.toUpperCase()}</small>`;
                });
            }
        } else {
            resultDiv.className = "result-box invalid";
            resultDiv.style.backgroundColor = "var(--status-invalid)";
            resultDiv.innerHTML = `❌ CÓDIGO NO VÁLIDO<br><small style="font-size:0.8rem; font-weight:normal;">${token}</small>`;
        }
    }

    function inicializarEscaner() {
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: { width: 220, height: 220 } }, 
            false
        );
        html5QrcodeScanner.render(onScanSuccess);
    }

    function reiniciarEscaner() {
        document.getElementById('result').style.display = 'none';
        inicializarEscaner();
    }

    function exportarReporte() {
        let csvContent = "data:text/csv;charset=utf-8,Codigo,Nombre,Tipo,Estado,Hora_Ingreso,Apartado\n";
        
        const apartados = ['clase', 'elegidos', 'masterclass', 'festival'];
        
        apartados.forEach(modo => {
            let data = dbCache[modo];
            for (let id in data) {
                let t = data[id];
                csvContent += `${id},"${t.nombre}",${t.tipo},${t.usado ? 'INGRESADO' : 'NO ASISTIO'},${t.fechaIngreso || '-'},${modo.toUpperCase()}\n`;
            }
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `reporte_general_eventos_tiempo_real.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function resetearBaseDatosModo() {
        if (confirm(`¿Seguro que quieres borrar todos los registros en la nube de TODOS los apartados (Clase, Elegidos, Masterclass y Festival)?`)) {
            Promise.all([
                db.ref('clase').remove(),
                db.ref('elegidos').remove(),
                db.ref('masterclass').remove(),
                db.ref('festival').remove()
            ]).then(() => {
                inicializarNubeSiEsNecesario();
                alert("Base de datos reiniciada correctamente para todos los apartados.");
                document.getElementById('result').style.display = 'none';
            });
        }
    }

    // --- EFECTO CURSOR ---
    const cursorGlow = document.getElementById('cursor-glow');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let glowX = mouseX, glowY = mouseY;
    let isMobile = window.innerWidth <= 900;

    if (!isMobile) {
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        function animateCursor() {
            glowX += (mouseX - glowX) * 0.15;
            glowY += (mouseY - glowY) * 0.15;
            cursorGlow.style.transform = `translate3d(calc(${glowX}px - 50%), calc(${glowY}px - 50%), 0)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();
    } else {
        cursorGlow.style.display = 'none';
    }

    window.onload = () => {
        inicializarNubeSiEsNecesario();
        escucharCambiosEnTiempoReal();
        inicializarEscaner();
    };
</script>
